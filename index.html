<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Fresh Web App</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0fdf4;
            color: #166534;
        }
        .card {
            background: #ffffff;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            text-align: center;
            border: 1px solid #bbf7d0;
        }
        h1 { margin-top: 0; color: #15803d; }
        button {
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover { background-color: #15803d; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎉 Fresh Start Success!</h1>
        <p>Your brand new, clean deployment is officially live on Vercel.</p>
        <button onclick="alert('Working perfectly!')">Test Click</button>
    </div>
</body>
</html>
